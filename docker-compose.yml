services:
  db:
    image: mysql:8.4
    container_name: canarypilot-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: canarypilot
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [canary-network]

  backend:
    build: ./backend
    container_name: canarypilot-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      DB_NAME: canarypilot
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [canary-network]

  frontend:
    build: ./frontend
    container_name: canarypilot-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [canary-network]

  nginx:
    image: nginx:alpine
    container_name: canarypilot-nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks: [canary-network]

volumes:
  mysql_data:

networks:
  canary-network:
    driver: bridge
