---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: {{ include "canarypilot.name" . }}-backend
spec:
  selector:
    app: {{ include "canarypilot.name" . }}-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
