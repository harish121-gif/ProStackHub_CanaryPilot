apiVersion: apps/v1
kind: Deployment
metadata:
  name: canarypilot-backend-canary
  namespace: canarypilot
  labels:
    app: canarypilot-backend
    release-track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canarypilot-backend
      release-track: canary
  template:
    metadata:
      labels:
        app: canarypilot-backend
        release-track: canary
    spec:
      containers:
        - name: backend
          image: canarypilot-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: canarypilot
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: canarypilot-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: canarypilot-db-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
