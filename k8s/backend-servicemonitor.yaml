apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: canarypilot-backend
  namespace: canarypilot
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: canarypilot-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
