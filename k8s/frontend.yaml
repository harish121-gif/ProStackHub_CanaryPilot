apiVersion: apps/v1
kind: Deployment
metadata:
  name: canarypilot-frontend
  namespace: canarypilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: canarypilot-frontend
  template:
    metadata:
      labels:
        app: canarypilot-frontend
    spec:
      containers:
        - name: frontend
          image: canarypilot-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: canarypilot
spec:
  selector:
    app: canarypilot-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
