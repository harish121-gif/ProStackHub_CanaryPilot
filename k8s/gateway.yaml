apiVersion: v1
kind: ConfigMap
metadata:
  name: canarypilot-gateway-config
  namespace: canarypilot
data:
  nginx.conf: |
    events {}
    http {
      upstream frontend { server frontend:80; }
      upstream backend { server backend:5000; }
      server {
        listen 80;
        location /api/ {
          proxy_pass http://backend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /metrics {
          proxy_pass http://backend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
        }
        location / {
          proxy_pass http://frontend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canarypilot-gateway
  namespace: canarypilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canarypilot-gateway
  template:
    metadata:
      labels:
        app: canarypilot-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: canarypilot-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: canarypilot
spec:
  type: NodePort
  selector:
    app: canarypilot-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
