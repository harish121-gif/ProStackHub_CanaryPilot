grafana:
  enabled: true
  adminPassword: admin123
  service:
    type: NodePort
    nodePort: 30030
  persistence:
    enabled: true
    size: 1Gi

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector:
      matchNames:
        - canarypilot
    retention: 3d

grafanaOperator:
  enabled: false
alertmanager:
  enabled: true
  service:
    type: ClusterIP
